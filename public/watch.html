<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<title>Tonton Video — raaa Preset Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>

:root{--base:#0B0B0C;--s:#161618;--s2:#1E1E21;--s3:#28282C;--stroke:#2A2A2E;--paper:#F5F5F4;--mute:#9B9BA1;--mute2:#6E6E74;--ok:#3ECF8E;--bad:#F0654E;
--d3:0 1px 0 0 rgba(255,255,255,.08) inset,0 1px 0 0 rgba(255,255,255,.05),0 20px 40px -16px rgba(0,0,0,.8);
--d3s:0 1px 0 0 rgba(255,255,255,.07) inset,0 10px 20px -10px rgba(0,0,0,.7);
--in:inset 0 2px 4px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.04);color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;padding-top:env(safe-area-inset-top,0)}
section[id]{scroll-margin-top:88px}
body{background:var(--base) radial-gradient(ellipse 120% 60% at 50% -10%,rgba(245,245,244,.05),transparent 60%) no-repeat;color:var(--paper);font:400 14px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
::selection{background:var(--paper);color:var(--base)}
.d{font-family:'Space Grotesk',sans-serif}.m{font-family:'JetBrains Mono',monospace}
.w{max-width:768px;margin:0 auto;padding:0 20px}
.gpu{will-change:transform;transform:translateZ(0)}

header{position:sticky;top:0;z-index:30;background:rgba(11,11,12,.9);backdrop-filter:blur(12px)}
.hb{display:flex;align-items:center;justify-content:space-between;padding:20px 0}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--paper);font:600 18px 'Space Grotesk';letter-spacing:-.01em;cursor:pointer}
.sq{width:40px;height:40px;border-radius:16px;background:var(--s2);display:grid;place-items:center;box-shadow:var(--d3s);border:0;color:var(--paper);cursor:pointer;flex:none}
.sq:active{background:var(--s3)}
.bur{position:relative;width:18px;height:18px;display:block}
.bur i{position:absolute;left:0;top:8px;width:18px;height:2px;border-radius:2px;background:currentColor;transition:transform .4s cubic-bezier(.16,1,.3,1)}
.bur i:first-child{transform:translateY(-4px)}.bur i:last-child{transform:translateY(4px)}
#mb.open .bur i:first-child{transform:rotate(45deg)}#mb.open .bur i:last-child{transform:rotate(-45deg)}
#mb{transition:background .25s,transform .15s}#mb:active{transform:scale(.94)}#mb.open{background:var(--s3)}
.mw{position:absolute;top:100%;left:50%;width:100%;max-width:768px;transform:translateX(-50%);padding:0 20px;display:grid;grid-template-rows:0fr;opacity:0;visibility:hidden;transition:grid-template-rows .5s cubic-bezier(.16,1,.3,1),opacity .3s ease,visibility 0s linear .5s}
.mw.open{grid-template-rows:1fr;opacity:1;visibility:visible;transition:grid-template-rows .5s cubic-bezier(.16,1,.3,1),opacity .3s ease,visibility 0s}
.mw>div{overflow:hidden;min-height:0}
.mw nav{margin-bottom:14px;background:var(--s);border-radius:20px;padding:8px;box-shadow:var(--d3s);border:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:4px;transform:translateY(-10px);transition:transform .5s cubic-bezier(.16,1,.3,1)}
.mw.open nav{transform:none}
.mw small{display:block;padding:8px 12px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute2)}
.mw a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;color:var(--paper);text-decoration:none;opacity:0;transform:translateY(-6px);transition:opacity .3s,transform .4s cubic-bezier(.16,1,.3,1),background .2s}
.mw.open a{opacity:1;transform:none}.mw.open a:nth-of-type(1){transition-delay:.06s}.mw.open a:nth-of-type(2){transition-delay:.12s}.mw.open a:nth-of-type(3){transition-delay:.18s}
.mw a:active{background:var(--s3)}.mw a b{display:block;font:600 14px 'Space Grotesk'}.mw a span span{display:block;font-size:12px;color:var(--mute)}
.mw a>svg:last-child{margin-left:auto;color:var(--mute2)}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}

.hero{padding:34px 0 26px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--s2);border-radius:99px;padding:6px 14px;font-size:12px;color:var(--mute);box-shadow:var(--d3s)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
.hero h1{font:700 clamp(32px,8vw,48px)/1.08 'Space Grotesk';letter-spacing:-.03em;margin:18px 0 12px}
.hero p{color:var(--mute);max-width:520px;margin:0 auto;font-size:14.5px}

.card{background:var(--s);border-radius:28px;padding:24px;box-shadow:var(--d3);border:1px solid rgba(255,255,255,.07)}
.row{display:flex;align-items:center;gap:14px}
.ic{width:48px;height:48px;border-radius:16px;background:var(--s2);display:grid;place-items:center;flex:none}
.card h2,.card h3{font:600 15px 'Space Grotesk'}.sub{color:var(--mute);font-size:12px;display:flex;align-items:center;gap:6px;margin-top:2px}
.field{display:flex;align-items:center;gap:10px;margin-top:20px;background:var(--base);border-radius:18px;padding:10px;box-shadow:var(--in);border:1px solid #232326}
.field:focus-within{border-color:#4a4a50}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--paper);font:500 14px 'JetBrains Mono',monospace;padding:12px 8px}
.field input::placeholder{color:var(--mute2)}
.ib{width:44px;height:44px;border-radius:12px;background:var(--s2);border:0;color:var(--paper);display:grid;place-items:center;box-shadow:var(--d3s);cursor:pointer;flex:none;transition:transform .15s}
.ib:active{transform:scale(.95)}
.go{width:100%;margin-top:14px;height:50px;border:0;border-radius:99px;background:var(--paper);color:var(--base);font:600 15px 'Space Grotesk';cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--d3s);transition:transform .15s}
.go:active{transform:scale(.98)}.go:disabled{opacity:.55;cursor:wait}
.sp{width:16px;height:16px;border:2px solid #0b0b0c44;border-top-color:var(--base);border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@keyframes pd{50%{opacity:.35;transform:scale(.85)}}
.live{animation:pd 1.8s ease-in-out infinite}

.stitle{display:flex;align-items:center;gap:10px;margin:0 0 16px}
.stitle b{font:600 15px 'Space Grotesk'}
.badge{min-width:20px;height:20px;border-radius:99px;background:var(--s2);display:inline-grid;place-items:center;padding:0 6px;font-size:11px;font-weight:500}
.vid{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:22px}
.frame{aspect-ratio:var(--ar,9/16);max-height:520px;width:100%;border-radius:20px;overflow:hidden;background:#000 center/cover;box-shadow:var(--d3s);border:1px solid var(--stroke)}
.frame{position:relative}
.pv{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.pctl{position:absolute;left:10px;right:10px;bottom:12px;display:flex;justify-content:space-between;pointer-events:none}
.pbtn{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:0;background:rgba(11,11,12,.6);backdrop-filter:blur(8px);color:var(--paper);display:grid;place-items:center;cursor:pointer}
.pbtn:active{transform:scale(.92)}
.pbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.15)}
.pbar b{display:block;height:100%;width:0;background:var(--ok)}
.pimg{position:absolute;inset:0;display:block;text-decoration:none;color:var(--paper)}.pimg span{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:rgba(11,11,12,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font:600 12px 'Space Grotesk'}
.pif{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.pnone{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;color:var(--paper);text-decoration:none;background:rgba(11,11,12,.45);font:600 13px 'Space Grotesk'}
.desc{color:rgba(245,245,244,.88);overflow-wrap:anywhere;font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{background:var(--base);border-radius:16px;padding:12px 14px;box-shadow:var(--in);border:1px solid #232326;min-width:0}
.stat small{display:block;font-size:10.5px;letter-spacing:.08em;color:var(--mute2);text-transform:uppercase}
.stat b{font:600 17px 'Space Grotesk';display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc{display:flex;align-items:center;gap:8px}.acc img{width:22px;height:22px;border-radius:50%;object-fit:cover}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--s2);color:var(--mute);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:500;text-decoration:none}
.chip.hi{background:var(--paper);color:var(--base)}
.pre{display:flex;gap:14px;margin-top:12px}
.pre:first-of-type{margin-top:0}
.th{width:84px;height:84px;border-radius:16px;background:var(--s2) center/cover;flex:none;display:grid;place-items:center;color:var(--mute);font:600 13px 'JetBrains Mono';box-shadow:var(--d3s)}
.pb{min-width:0;flex:1}.pb h3{font-size:15.5px;overflow-wrap:anywhere}
.pb .m{font-size:12px;color:var(--mute);word-break:break-all;margin:6px 0 12px;line-height:1.5}
.who{font-size:12px;color:var(--mute2);margin-top:2px}
.act{display:flex;gap:8px}
.btn{height:40px;padding:0 18px;border-radius:99px;border:0;font:600 13px 'Space Grotesk';cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none;box-shadow:var(--d3s);transition:transform .15s}
.btn:active{transform:scale(.96)}.btn.p{background:var(--paper);color:var(--base)}.btn.o{background:var(--s2);color:var(--paper)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:48px 24px}
.empty .ic{width:56px;height:56px;color:var(--mute)}.empty p{color:var(--mute);max-width:280px;font-size:13px}
.err{color:var(--bad)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fi{background:var(--s);border-radius:22px;padding:18px;box-shadow:var(--d3s);border:1px solid rgba(255,255,255,.06)}
.fi .ic{width:38px;height:38px;border-radius:12px;margin-bottom:12px}.fi h3{font:600 14px 'Space Grotesk'}.fi p{color:var(--mute);font-size:12.5px;margin-top:4px}
.foot{text-align:center;color:var(--mute2);font-size:12px;padding:34px 0 120px}

.bn{position:sticky;bottom:0;z-index:20;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0))}
.bn div{max-width:768px;margin:0 auto;display:flex;background:rgba(22,22,24,.95);border-radius:26px;padding:8px;box-shadow:var(--d3s);border:1px solid rgba(255,255,255,.06);backdrop-filter:blur(12px)}
.bn a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-radius:14px;color:var(--mute2);text-decoration:none;font-size:11px;font-weight:500;transition:.2s}
.bn a.on{background:var(--s2);color:var(--paper)}
.ts{position:fixed;inset:12px 0 auto;z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;padding:0 16px;pointer-events:none}
.t{max-width:380px;width:100%;background:var(--s2);border-radius:16px;padding:12px 16px;box-shadow:var(--d3);border:1px solid rgba(255,255,255,.08);display:flex;gap:10px;align-items:center;animation:up .45s cubic-bezier(.16,1,.3,1);font-weight:500}
.t i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}.t.e i{background:var(--bad)}
[hidden]{display:none!important}
@media(max-width:640px){.vid{grid-template-columns:1fr}.frame{max-width:260px;margin:0 auto}.grid{grid-template-columns:1fr}.pre{flex-direction:column}.th{width:100%;height:140px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}


.go,.ib,.btn,.chip,.sq,.logo{transition:transform .3s cubic-bezier(.16,1,.3,1),background-color .4s,color .4s,box-shadow .25s,opacity .3s}
.go:active,.btn:active,.chip:active,.ib:active{transform:scale(.94)}
.logo:active .sq{transform:scale(.9) rotate(-10deg)}
.mi{position:relative;display:inline-block;width:18px;height:18px;flex:none}
.go .mi{width:20px;height:20px}
.mi>svg{position:absolute;inset:0;width:100%;height:100%;opacity:0;transform:scale(.3) rotate(-120deg);transition:opacity .25s,transform .55s cubic-bezier(.16,1,.3,1)}
[data-s=idle] .mi>[data-st=idle],[data-s=busy] .mi>[data-st=busy],[data-s=ok] .mi>[data-st=ok],[data-s=err] .mi>[data-st=err]{opacity:1;transform:none}
.lbs{display:inline-grid;justify-items:center}
.lbs>span{grid-area:1/1;opacity:0;transform:translateY(10px);filter:blur(3px);transition:opacity .3s,transform .5s cubic-bezier(.16,1,.3,1),filter .3s;white-space:nowrap}
[data-s=idle] .lbs>[data-st=idle],[data-s=busy] .lbs>[data-st=busy],[data-s=ok] .lbs>[data-st=ok],[data-s=err] .lbs>[data-st=err]{opacity:1;transform:none;filter:none}
.go{gap:10px}.go[data-s=busy]{pointer-events:none}
.go[data-s=ok],.btn[data-s=ok]{background:var(--ok);color:var(--base)}
.go[data-s=err]{background:var(--bad);color:var(--base)}
.ib[data-s=ok]{color:var(--ok)}.ib[data-s=err]{color:var(--bad)}
.mi>[data-st=busy] use{transform-origin:12px 12px;animation:scan 1.1s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translate(-2px,-1px) rotate(-10deg)}50%{transform:translate(2px,1px) rotate(10deg)}}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.field.sh{animation:sh .4s}
.ib{position:relative;z-index:1;transition:transform .3s cubic-bezier(.16,1,.3,1),background-color .4s,color .4s,opacity .3s,margin .55s cubic-bezier(.16,1,.3,1)}
#cl{z-index:0}
.ib.hid{margin-right:-54px;opacity:0;pointer-events:none}
[data-s=hid] .mi>[data-st=hid]{opacity:1;transform:none}
.arr{transition:transform .3s cubic-bezier(.16,1,.3,1)}.btn:hover .arr,.btn:active .arr{transform:translate(2px,-2px)}

.bn div{position:relative}.bn a{position:relative;z-index:1}.bn a.on{background:none}
.ind{position:absolute;top:8px;bottom:8px;left:8px;width:calc((100% - 16px)/4);background:var(--s2);border-radius:14px;box-shadow:var(--d3s);transition:transform .5s cubic-bezier(.16,1,.3,1)}
.bn a svg{transition:transform .45s cubic-bezier(.16,1,.3,1)}.bn a.on svg{transform:translateY(-2px) scale(1.12)}


html.lk{overflow:hidden}html:not(.lk) #ig{display:none}
html.hld header,html.hld #cari,html.hld #hasil,html.hld #info,html.hld .bn{opacity:0;translate:0 22px;scale:.98}
#ig{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--base);transition:background .3s ease,opacity .2s ease .55s}
#ig.re{background:rgba(11,11,12,.72);backdrop-filter:blur(8px)}
#ig.out{background:transparent;opacity:0;pointer-events:none}
.igb{position:relative;width:64px;height:64px;border-radius:32px;background:var(--s);border:1px solid rgba(255,255,255,.08);box-shadow:var(--d3);overflow:hidden;transition:width .75s cubic-bezier(.16,1,.3,1),height .6s cubic-bezier(.16,1,.3,1),border-radius .75s cubic-bezier(.16,1,.3,1),transform .4s cubic-bezier(.4,0,.2,1),opacity .3s}
#ig.out .igb{transform:scale(.5);opacity:0}
.igl{position:absolute;inset:0;display:grid;place-items:center;transition:opacity .25s;pointer-events:none}
.igl i{width:24px;height:24px;border:2.5px solid var(--s3);border-top-color:var(--ok);border-radius:50%;animation:r .8s linear infinite}
.igi{width:min(88vw,340px);padding:24px 22px 18px;opacity:0;transition:opacity .45s .3s}
.igb.o .igl{opacity:0}.igb.o .igi{opacity:1}
.igi h2{font:700 22px/1.15 'Space Grotesk';letter-spacing:-.02em;margin:0 30px 8px 0}
.igi p{color:var(--mute);font-size:14px;line-height:1.5;margin:0 0 18px}
.igx{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:0;background:var(--s2);color:var(--mute);display:grid;place-items:center;cursor:pointer}
.iga{display:flex;gap:8px}.iga .btn{flex:1;justify-content:center;height:44px}
.igt{display:block;width:100%;margin-top:6px;height:40px;background:none;border:0;color:var(--mute);font:500 13px Inter;cursor:pointer}

/* =========================================================
   NEOBRUTALIST UI OVERRIDE — VISUAL ONLY
   White + Electric Blue / hard-offset / terminal-inspired.
   ========================================================= */
:root{
  --base:#ffffff;
  --s:#ffffff;
  --s2:#eaf0ff;
  --s3:#dff7ff;
  --stroke:#050505;
  --paper:#050505;
  --mute:#343434;
  --mute2:#666666;
  --ok:#b7ff00;
  --bad:#ff4d6d;

  /* Change these variables to recolor the whole UI */
  --neo-blue:#145cff;
  --neo-blue-2:#00c8ff;
  --neo-yellow:#d9ff00;
  --neo-pink:#ff66c4;
  --neo-purple:#8b5cf6;

  --neo-border:2px solid #050505;
  --neo-shadow:6px 6px 0 #050505;
  --neo-shadow-sm:4px 4px 0 #050505;
  --neo-ease:cubic-bezier(.34,1.4,.64,1);
  --d3:6px 6px 0 #050505;
  --d3s:4px 4px 0 #050505;
  --in:inset 0 0 0 2px #050505;
  color-scheme:light;
}

html{background:var(--base)}
body{
  background:
    linear-gradient(rgba(20,92,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(20,92,255,.045) 1px,transparent 1px),
    #fff;
  background-size:24px 24px;
  color:var(--paper);
  font-family:Inter,system-ui,sans-serif;
}
::selection{background:var(--neo-blue);color:#fff}
.d{font-family:'Space Grotesk',sans-serif}
.m{font-family:'JetBrains Mono',monospace}


/* Theme Lab */
.theme-lab{margin:10px 0 14px;background:#fff;border:2px solid #050505;border-radius:6px;box-shadow:6px 6px 0 #050505;padding:12px;font-family:'JetBrains Mono',monospace;color:#050505}
.theme-lab-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.theme-dot{width:12px;height:12px;border:2px solid #050505;background:var(--neo-blue);display:inline-block}
.theme-swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:10px}
.theme-swatch{height:30px;border:2px solid #050505;box-shadow:3px 3px 0 #050505;cursor:pointer;transition:transform .3s var(--neo-ease),box-shadow .2s}
.theme-swatch:hover{transform:translate(-2px,-2px) rotate(-2deg);box-shadow:5px 5px 0 #050505}
.theme-custom{display:flex;align-items:center;gap:8px}
.theme-custom label{font-size:10px;font-weight:700;flex:1}
#themeColor{width:42px;height:32px;padding:0;border:2px solid #050505;background:#fff;cursor:pointer}
/* Terminal-inspired header */
header{
  background:#fff;
  border-bottom:var(--neo-border);
  box-shadow:0 3px 0 #050505;
  backdrop-filter:none;
}
.hb{
  padding:13px 0;
  font-family:'JetBrains Mono',monospace;
}
.hb::before{
  content:'>_';
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:38px;
  height:28px;
  margin-right:8px;
  padding:0 7px;
  background:#050505;
  color:var(--neo-blue-2);
  border:2px solid #050505;
  font:700 13px/1 'JetBrains Mono',monospace;
}
.logo{
  color:#050505;
  font:700 13px/1 'JetBrains Mono',monospace;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.logo::after{
  content:'_';
  color:var(--neo-blue);
  animation:cursorBlink .9s steps(2,end) infinite;
}
@keyframes cursorBlink{50%{opacity:0}}
.sq{
  width:40px;height:40px;
  border-radius:6px;
  background:var(--neo-blue);
  border:var(--neo-border);
  box-shadow:var(--neo-shadow-sm);
  color:#fff;
  transition:transform .35s var(--neo-ease),box-shadow .2s;
}
.sq:hover{transform:translate(-2px,-2px) rotate(-5deg);box-shadow:6px 6px 0 #050505}
.sq:active{transform:translate(4px,4px) rotate(5deg);box-shadow:0 0 0 #050505}
.bur i{height:2px;border-radius:0}
#mb{transition:transform .35s var(--neo-ease),background .2s}
#mb.open{background:var(--neo-blue);color:#fff}

/* Mobile menu */
.mw nav{
  background:#fff;
  border:var(--neo-border);
  border-radius:6px;
  box-shadow:var(--neo-shadow);
  padding:7px;
  transform:translateY(-12px) rotate(-.7deg);
  transition:transform .5s var(--neo-ease);
}
.mw.open nav{transform:translateY(0) rotate(0)}
.mw small{color:#050505;font-family:'JetBrains Mono',monospace}
.mw a{border-radius:4px!important}
.mw a:hover{
  background:var(--neo-blue)!important;
  color:#fff!important;
  transform:translateX(4px) rotate(-1deg);
}

/* Hero */
.hero{padding-top:38px}
.hero h1{
  color:#050505;
  font-weight:800;
  text-transform:uppercase;
  text-shadow:3px 3px 0 var(--neo-blue-2);
}
.hero p{color:#343434}
.hero .live{
  background:var(--neo-yellow)!important;
  color:#050505!important;
  border:2px solid #050505!important;
  box-shadow:3px 3px 0 #050505;
}

/* Main cards */
.card{
  background:#fff;
  border:var(--neo-border);
  border-radius:6px;
  box-shadow:var(--neo-shadow);
  padding:24px;
  position:relative;
  transition:transform .4s var(--neo-ease),box-shadow .25s;
}
.card:hover{
  transform:translate(-2px,-3px) rotate(-.25deg);
  box-shadow:9px 9px 0 #050505;
}
.ic{
  background:var(--neo-blue-2);
  border:var(--neo-border);
  border-radius:5px;
  box-shadow:var(--neo-shadow-sm);
  color:#050505;
  transition:transform .5s var(--neo-ease);
}
.ic:hover{transform:rotate(9deg) scale(1.04)}
.card h2,.card h3{color:#050505;font-weight:800}
.sub{color:#555}

.mode-switch{display:flex;gap:8px;margin:18px 0 12px}
.mode-option{flex:1;padding:11px 14px;border:2px solid #050505;border-radius:5px;background:#fff;color:#050505;font-weight:800;box-shadow:3px 3px 0 #050505;cursor:pointer}
.mode-option.active{background:var(--neo-blue);color:#fff;transform:translate(-1px,-1px);box-shadow:4px 4px 0 #050505}
/* Search field */
.field{
  background:#fff;
  border:var(--neo-border);
  border-radius:5px;
  box-shadow:var(--neo-shadow-sm);
  padding:8px;
  transition:transform .4s var(--neo-ease),box-shadow .25s;
}
.field:focus-within{
  border-color:#050505;
  transform:translate(-2px,-2px) rotate(-.25deg);
  box-shadow:6px 6px 0 #050505;
}
.field input{color:#050505}
.field input::placeholder{color:#777}
.ib{
  background:var(--neo-blue);
  color:#fff;
  border:var(--neo-border);
  border-radius:5px;
  box-shadow:var(--neo-shadow-sm);
  transition:transform .35s var(--neo-ease),margin .55s var(--neo-ease);
}
.ib:hover{transform:translate(-2px,-2px) rotate(-7deg)}
.ib:active{transform:translate(3px,3px) rotate(8deg);box-shadow:0 0 0 #050505}

/* Main action */
.go{
  height:52px;
  background:var(--neo-blue);
  color:#fff;
  border:var(--neo-border);
  border-radius:5px;
  box-shadow:var(--neo-shadow);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.02em;
  transition:transform .35s var(--neo-ease),box-shadow .25s,background .2s;
}
.go:hover{
  transform:translate(-3px,-3px) rotate(-.8deg);
  box-shadow:10px 10px 0 #050505;
}
.go:active{
  transform:translate(5px,5px) rotate(.8deg);
  box-shadow:0 0 0 #050505;
}
.go[data-s=ok]{background:var(--ok);color:#050505}
.go[data-s=err]{background:var(--bad);color:#050505}
.sp{border-color:#1114;border-top-color:var(--neo-blue)}

/* Status / badges */
.badge{
  background:var(--neo-blue-2);
  color:#050505;
  border:2px solid #050505;
  border-radius:4px;
  box-shadow:3px 3px 0 #050505;
}
.chip{
  background:#fff;
  color:#050505;
  border:2px solid #050505;
  border-radius:4px;
  box-shadow:3px 3px 0 #050505;
  transition:transform .35s var(--neo-ease),box-shadow .2s,background .2s;
}
.chip:hover{
  transform:translate(-2px,-2px) rotate(-2deg);
  box-shadow:5px 5px 0 #050505;
  background:var(--neo-blue-2);
}
.chip.hi{background:var(--neo-yellow);color:#050505}

/* Video/result */
.frame{
  border:var(--neo-border);
  border-radius:5px;
  box-shadow:var(--neo-shadow);
}
.pbtn{
  background:var(--neo-yellow);
  color:#050505;
  border:2px solid #050505;
  border-radius:4px;
  box-shadow:3px 3px 0 #050505;
  transition:transform .35s var(--neo-ease);
}
.pbtn:hover{transform:rotate(8deg) translate(-2px,-2px)}
.pbtn:active{transform:translate(2px,2px) rotate(-6deg)}
.pimg span{
  background:var(--neo-blue-2);
  color:#050505;
  border:2px solid #050505;
  border-radius:4px;
  box-shadow:3px 3px 0 #050505;
  backdrop-filter:none;
}
.desc{color:#222}
.stat{
  background:var(--s3);
  border:var(--neo-border);
  border-radius:5px;
  box-shadow:var(--neo-shadow-sm);
}
.stat small{color:#555}
.stat b{color:#050505}

/* Preset/result actions */
.th{
  background:var(--neo-blue);
  border:var(--neo-border);
  border-radius:5px;
  box-shadow:var(--neo-shadow-sm);
}
.who{color:#666}
.btn{
  border:var(--neo-border);
  border-radius:5px;
  box-shadow:var(--neo-shadow-sm);
  color:#050505!important;
  transition:transform .35s var(--neo-ease),box-shadow .2s,background .2s;
}
.btn:hover{
  transform:translate(-2px,-2px) rotate(-1deg);
  box-shadow:6px 6px 0 #050505;
}
.btn:active{transform:translate(3px,3px) rotate(1deg);box-shadow:0 0 0 #050505}
.btn.p{background:var(--neo-yellow)}
.btn.o{background:var(--neo-blue-2)}
.btn[data-s=ok]{background:var(--ok);color:#050505}

/* Feature cards */
.fi{
  background:#fff;
  border:var(--neo-border);
  border-radius:5px;
  box-shadow:var(--neo-shadow-sm);
  transition:transform .45s var(--neo-ease),box-shadow .25s;
}
.fi:nth-child(1){transform:rotate(-.8deg)}
.fi:nth-child(2){transform:rotate(.7deg)}
.fi:nth-child(3){transform:rotate(-.4deg)}
.fi:hover{
  transform:translate(-3px,-4px) rotate(0deg)!important;
  box-shadow:7px 7px 0 #050505;
}
.fi .ic{background:var(--neo-yellow);border:2px solid #050505;box-shadow:3px 3px 0 #050505}
.fi h3{color:#050505}
.fi p{color:#444}

/* Bottom nav */
.bn{padding-bottom:calc(16px + env(safe-area-inset-bottom,0))}
.bn div{
  background:#fff;
  border:var(--neo-border);
  border-radius:6px;
  box-shadow:var(--neo-shadow);
  backdrop-filter:none;
}
.bn a{
  color:#666;
  border-radius:4px;
  transition:transform .4s var(--neo-ease),color .2s;
}
.bn a:hover{transform:translateY(-3px) rotate(-2deg);color:#050505}
.ind{
  background:var(--neo-blue);
  border:2px solid #050505;
  border-radius:4px;
  box-shadow:3px 3px 0 #050505;
  transition:transform .55s var(--neo-ease);
}
.bn a.on{color:#050505}
.bn a.on svg{transform:translateY(-3px) scale(1.12) rotate(-5deg)}

/* Toast */
.t{
  background:var(--neo-yellow);
  color:#050505;
  border:var(--neo-border);
  border-radius:5px;
  box-shadow:var(--neo-shadow);
  animation:neoToast .55s var(--neo-ease);
}
.t i{background:#050505}
.t.e{background:var(--bad)}
@keyframes neoToast{
  0%{opacity:0;transform:translateY(-24px) rotate(-5deg) scale(.92)}
  65%{transform:translateY(3px) rotate(1deg) scale(1.02)}
  100%{opacity:1;transform:none}
}

/* Intro modal */
#ig{background:#fff}
#ig.re{background:rgba(255,255,255,.8);backdrop-filter:blur(7px)}
.igb{
  background:#fff;
  border:var(--neo-border);
  border-radius:6px;
  box-shadow:10px 10px 0 #050505;
}
.igx{
  background:var(--neo-blue-2);
  color:#050505;
  border:2px solid #050505;
  border-radius:5px;
  box-shadow:3px 3px 0 #050505;
  transition:transform .35s var(--neo-ease);
}
.igx:hover{transform:rotate(10deg) translate(-2px,-2px)}
.igi p{color:#444}
.igt{color:#555}
.qr{border:var(--neo-border);border-radius:5px;box-shadow:var(--neo-shadow-sm)}
.iga .btn{background:var(--neo-blue);color:#fff!important}

/* Playful micro-interactions */
.logo .sq{animation:neoFloat 3.8s ease-in-out infinite}
.hero .live{animation:neoPop 2.8s ease-in-out infinite}
@keyframes neoFloat{
  0%,100%{transform:rotate(-2deg) translateY(0)}
  50%{transform:rotate(3deg) translateY(-3px)}
}
@keyframes neoPop{
  0%,100%{transform:scale(1) rotate(0)}
  8%{transform:scale(1.08) rotate(-2deg)}
  16%{transform:scale(1) rotate(1deg)}
}
@keyframes neoWiggle{
  0%,100%{transform:translateX(0) rotate(0)}
  25%{transform:translateX(-4px) rotate(-1deg)}
  50%{transform:translateX(4px) rotate(1deg)}
  75%{transform:translateX(-2px) rotate(-.5deg)}
}
.field.sh{animation:neoWiggle .45s var(--neo-ease)}
.arr{transition:transform .35s var(--neo-ease)}
.btn:hover .arr{transform:translate(4px,-4px) rotate(-5deg)}
.mi>svg{transition:opacity .25s,transform .55s var(--neo-ease)}
@keyframes scan{
  0%,100%{transform:translate(-2px,-1px) rotate(-12deg)}
  50%{transform:translate(2px,1px) rotate(12deg)}
}
@media(prefers-reduced-motion:reduce){
  .logo .sq,.hero .live{animation:none!important}
}

/* Mobile-first polish */
@media(max-width:600px){
  .card{padding:18px;box-shadow:5px 5px 0 #050505}
  .hero h1{text-shadow:2px 2px 0 var(--neo-blue-2)}
  .go{width:100%}
}

/* Spotify-inspired SVG music player */
.music-player{position:fixed;left:14px;right:14px;bottom:14px;z-index:90;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:10px 12px;background:rgba(8,10,14,.96);color:#fff;border:2px solid #050505;box-shadow:8px 8px 0 #050505;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transform:translateY(calc(100% + 28px));opacity:0;pointer-events:none;transition:transform .35s cubic-bezier(.34,1.4,.64,1),opacity .25s ease}
.music-player.is-ready{transform:translateY(0);opacity:1;pointer-events:auto}
.music-cover{width:54px;height:54px;flex:none;border:2px solid #fff;background:#145cff center/cover no-repeat;display:grid;place-items:center;box-shadow:4px 4px 0 #145cff}
.music-cover svg{width:22px;height:22px}
.music-meta{min-width:0}
.music-kicker{font:700 9px/1 JetBrains Mono,monospace;letter-spacing:.12em;text-transform:uppercase;color:#8b949e;margin-bottom:5px}
.music-title{font:800 14px/1.15 Inter,system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music-artist{font:500 11px/1.2 Inter,system-ui,sans-serif;color:#a7adb7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.music-controls{display:flex;align-items:center;gap:7px}
.music-btn{width:34px;height:34px;border:2px solid #fff;background:#111;color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .15s,background .15s,color .15s;touch-action:manipulation}
.music-btn:hover{background:#fff;color:#050505;transform:translateY(-2px)}
.music-btn:active{transform:translate(2px,2px)}
.music-btn.main{width:42px;height:42px;background:#fff;color:#050505;border-color:#fff}
.music-btn.main:hover{background:var(--neo-blue,#145cff);color:#fff}
.music-btn svg{width:17px;height:17px}
.music-btn.main svg{width:19px;height:19px}
.music-progress{position:absolute;left:12px;right:12px;bottom:-7px;height:4px;background:#343a40;border:1px solid #050505;cursor:pointer}
.music-progress-fill{height:100%;width:0;background:var(--neo-blue,#145cff);transition:width .08s linear}
.music-time{position:absolute;right:14px;top:-17px;font:700 8px/1 JetBrains Mono,monospace;color:#fff}
.music-volume{display:flex;align-items:center;gap:5px;margin-left:3px}
.music-volume input{width:72px;accent-color:var(--neo-blue,#145cff)}
@media(max-width:600px){
  .music-player{left:8px;right:8px;bottom:8px;grid-template-columns:auto 1fr;gap:11px;padding:9px 10px}
  .music-cover{width:48px;height:48px}
  .music-controls{grid-column:2;justify-content:flex-start;margin-top:-5px}
  .music-btn{width:31px;height:31px}
  .music-btn.main{width:38px;height:38px}
  .music-volume{display:none}
  .music-progress{left:10px;right:10px}
}


.watch-top{display:flex;align-items:center;gap:12px;padding:18px 0}
.watch-back{display:inline-flex;align-items:center;gap:8px;color:var(--paper);text-decoration:none;background:var(--s);border:1px solid var(--stroke);padding:10px 14px;border-radius:14px;font-weight:600}
.watch-title{font:600 22px 'Space Grotesk';margin:8px 0 16px}
.watch-state{padding:26px;text-align:center}
.watch-state h3{font:600 18px 'Space Grotesk';margin:8px 0}
.watch-state p{color:var(--mute);margin-top:5px}
.watch-video{padding:14px}
.watch-video .vid{display:block}
.watch-video .frame{max-width:520px;margin:0 auto}
.watch-desc{padding:16px 18px 4px;overflow-wrap:anywhere}
.watch-actions{display:flex;gap:8px;flex-wrap:wrap;padding:14px 18px 18px}
@media(min-width:700px){.watch-video{padding:20px}}
</style>
</head>
<body>
<header><div class="w hb watch-top">
<a class="watch-back" href="index.html" aria-label="Kembali ke pencarian">← Kembali</a>
<div class="logo"><span class="sq" style="width:34px;height:34px;border-radius:12px">▶</span><span>raaa <span style="color:var(--mute)">Preset Finder</span></span></div>
</div></header>
<main class="w" style="padding-top:22px;padding-bottom:80px">
<div class="watch-title d">Tonton video</div>
<div id="content"><div class="card watch-state"><span class="dot live"></span><h3>Memuat video…</h3><p>Menyiapkan video dan informasi preset.</p></div></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>n==null?'—':n>=1e6?(n/1e6).toFixed(1)+' jt':n>=1e3?(n/1e3).toFixed(1)+' rb':n;
const params=new URLSearchParams(location.search),target=params.get('url')||'';
function render(j){
 const v=j.video||{},a=j.author||{},p=j.presets||[];
 const isYoutube=v.platform==='youtube';
 let player='';
 if(v.src||v.proxy) player=`<video class="pv" src="${esc(v.proxy||v.src)}" ${v.proxy&&v.src?`data-alt="${esc(v.src)}"`:''} poster="${esc(v.cover||'')}" controls playsinline preload="metadata" autoplay></video>`;
 else if(v.platform==='youtube'&&v.id) player=`<iframe class="pif" src="https://www.youtube.com/embed/${encodeURIComponent(v.id)}?playsinline=1&rel=0" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
 else player='<div class="pnone"><span>Video belum bisa diputar langsung dari sumber ini.</span></div>';
 let h=`<div class="card"><div class="watch-video"><div class="vid ${isYoutube&&!v.vertical?'yt':''}"><div class="frame" ${v.cover?`style="background-image:url('${esc(v.cover)}')"`:''}>${player}</div></div></div><div class="watch-desc"><h3 class="d">${esc(v.description||'Video preset')}</h3><p class="m" style="margin-top:8px">${esc(v.url||target)}</p><div class="stats"><div class="stat"><small>Akun</small><b>${esc(a.uniqueId||a.nickname||'—')}</b></div><div class="stat"><small>Views</small><b>${num(v.views)}</b></div><div class="stat"><small>Likes</small><b>${num(v.likes)}</b></div><div class="stat"><small>Komentar</small><b>${num(v.comments)}</b></div></div></div></div>`;
 if(p.length) h+=`<div class="stitle" style="margin-top:24px"><b class="d">Link preset</b><span class="badge">${p.length}</span></div><div class="card">${p.map((x,i)=>`<div class="pre"><div class="th" ${x.thumb?`style="background-image:url('${esc(x.thumb)}')"`:''}>${x.thumb?'':'PRESET'}</div><div class="pb"><h3 class="d">${esc(x.title||'Preset '+(i+1))}</h3><p class="m">${esc(x.url)}</p><div class="act"><a class="btn p" href="${esc(x.url)}" target="_blank" rel="noopener">Buka preset</a></div></div></div>`).join('')}</div>`;
 $('#content').innerHTML=h;
 const video=$('#content video.pv');
 if(video){
  video.addEventListener('error',()=>{
   const alt=video.dataset.alt;
   if(alt && !video.dataset.fallbackTried){video.dataset.fallbackTried='1';video.src=alt;video.load();return}
   let note=video.parentElement.querySelector('.video-error');
   if(!note){note=document.createElement('p');note.className='m video-error';note.style.cssText='padding:12px;text-align:center';note.textContent='Video tidak dapat diputar. URL MP4 mungkin kedaluwarsa atau layanan sumber sedang tidak tersedia.';video.parentElement.appendChild(note)}
  });
 }
}
async function start(){
 if(!target){$('#content').innerHTML='<div class="card watch-state"><h3>Link video tidak tersedia</h3><p>Kembali ke halaman pencarian dan pilih video yang ingin ditonton.</p><div class="act" style="justify-content:center;margin-top:14px"><a class="btn p" href="index.html">Kembali ke pencarian</a></div></div>';return}
 try{const r=await fetch('/api/find?url='+encodeURIComponent(target));const t=await r.text();let j;try{j=JSON.parse(t)}catch{throw Error('Respons server tidak valid')}if(!r.ok||j.ok===false)throw Error(j.error||'Video gagal dimuat');render(j)}catch(e){$('#content').innerHTML=`<div class="card watch-state"><h3>Video gagal dimuat</h3><p>${esc(e.message||'Coba lagi nanti.')}</p><div class="act" style="justify-content:center;margin-top:14px"><a class="btn p" href="index.html">Kembali ke pencarian</a><button class="btn o" onclick="location.reload()">Coba lagi</button></div></div>`}
}
start();
</script>
</body>
</html>
